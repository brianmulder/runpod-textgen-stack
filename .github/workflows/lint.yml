name: lint

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt jq
          npm install -g markdownlint-cli
          curl -L https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -o runpodctl
          chmod +x runpodctl
          sudo mv runpodctl /usr/local/bin/runpodctl
      - name: ShellCheck
        run: shellcheck bin/*.sh
      - name: shfmt
        run: shfmt -i 4 -s -d bin/*.sh
      - name: markdownlint
        run: markdownlint "**/*.md"
      - name: Validate pod spec
        run: runpodctl validate runpod/pod-spec.json
